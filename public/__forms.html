<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Contact — Ricardo Lopes</title></head><body>
<!-- Netlify build-time detection. Keep these fields in sync with ContactForm.tsx. -->
<form name="project-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="project-enquiry">
<input name="bot-field"><input name="locale"><input name="name" required maxlength="120"><input type="email" name="email" required maxlength="254">
<select name="project-type" required><option>website</option><option>application</option><option>shop</option><option>redesign</option><option>other</option></select>
<textarea name="message" required minlength="20" maxlength="5000"></textarea>
</form></body></html>
